[bootstrap.packages]
"brew:sapling" = { os = "macos" }

"brew-cask:android-studio" = { os = "macos" }
"brew-cask:bitwarden" = { os = "macos" }
"brew-cask:discord" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:notion" = { os = "macos" }
"brew-cask:obsidian" = { os = "macos" }
"brew-cask:orbstack" = { os = "macos" }
"brew-cask:secretive" = { os = "macos" }
"brew-cask:stats" = { os = "macos" }
"brew-cask:syncthing-app" = { os = "macos" }
"brew-cask:thaw" = { os = "macos" }
"brew-cask:whatsapp" = { os = "macos" }
"brew-cask:zed" = { os = "macos" }

[dotfiles]
"~/.config/dotfiles/host.env" = "~/repos/dotfiles/shell/host-secretive.env"
"~/.gitconfig.local" = "~/repos/dotfiles/git/local-darwin.conf"
"~/.aerospace.toml" = "~/repos/dotfiles/aerospace/config.toml"
"~/Library/Preferences/sapling/sapling.conf" = "~/repos/dotfiles/sapling/macos.conf"
"~/.config/dotfiles/ssh.conf" = "~/repos/dotfiles/ssh/secretive.conf"

[bootstrap.macos.keyboard]
key_repeat = 6
initial_key_repeat = 25
press_and_hold = false
automatic_capitalization = false
automatic_spelling_correction = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
NSAutomaticPeriodSubstitutionEnabled = false
"com.apple.swipescrolldirection" = false
"com.apple.trackpad.scaling" = 1.5

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllExtensions = true

[bootstrap.macos.defaults."com.apple.WindowManager"]
HideDesktop = true

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowDate = 0
ShowDayOfWeek = true
ShowSeconds = true

[tasks.bootstrap]
depends = ["herdr", "screenshots"]
